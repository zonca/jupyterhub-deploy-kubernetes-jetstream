# Values for the ngshare Helm chart when using a Manila CephFS volume.
#
# Instead of the default Cinder StorageClass (which has
# fsGroupPolicy=ReadWriteOnceWithFSType and does NOT apply fsGroup to
# ReadWriteMany volumes), use a static Manila CephFS PV/PVC:
#   - Storage class: manila-cephfs (see ngshare-standalone-repro-manila/00-storageclass.yaml)
#   - PV: created from nbgrader/ngshare-manila-pv.yaml template
#   - Binding: via pvc.selector below
# With CephFS CSI (fsGroupPolicy=File), fsGroup is honored on RWX volumes,
# so NO initContainer is needed.
ngshare:
  hub_api_token: REPLACE_WITH_A_LONG_RANDOM_TOKEN
  admins:
    - admin_username

deployment: {}

pvc:
  storage: 10Gi
  storageClassName: manila-cephfs
  accessModes:
    - ReadWriteMany
  selector:
    matchLabels:
      app: ngshare-manila
